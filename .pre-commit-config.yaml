repos:
  - repo: local
    hooks:
      - id: strip-image-metadata
        name: Strip and validate image metadata
        entry: /bin/bash scripts/hooks/pre-commit
        language: script
        types: [file]
        files: '(?i)\.(png|jpe?g|webp|gif|avif|bmp|tiff?|ico)$'
        require_serial: true
